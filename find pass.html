<style>
:root {
    --main: #00f0ff;
    --bg: #0b0f2a;
    --text: white;
}

body.light {
    --bg: #f5f7fa;
    --text: #111;
}

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, var(--bg), #000);
    color: var(--text);
    text-align: center;
    height: 100vh;
    overflow: hidden;
    transition: 0.4s;
}

/* نجوم */
body::before {
    content: "";
    position: absolute;
    width: 200%;
    height: 200%;
    background: url('https://www.transparenttextures.com/patterns/stardust.png');
    animation: moveStars 60s linear infinite;
    opacity: 0.3;
}

@keyframes moveStars {
    from { transform: translate(0,0); }
    to { transform: translate(-500px,-500px); }
}

/* Header */
.header {
    position: absolute;
    top: 10px;
    left: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    box-shadow: 0 0 10px var(--main);
}

/* زر الوضع */
.toggle-mode {
    position: absolute;
    top: 15px;
    right: 20px;
    cursor: pointer;
    background: var(--main);
    border: none;
    padding: 8px 15px;
    border-radius: 20px;
    font-weight: bold;
}

/* المحتوى */
.container {
    position: relative;
    top: 50%;
    transform: translateY(-50%);
}

h1 {
    font-size: 38px;
    text-shadow: 0 0 20px var(--main);
}

/* input */
input {
    padding: 12px;
    width: 260px;
    border-radius: 20px;
    border: none;
    outline: none;
    text-align: center;
    background: rgba(255,255,255,0.1);
    color: var(--text);
    box-shadow: 0 0 10px var(--main);
}

/* button */
button.search {
    padding: 12px 20px;
    margin-left: 10px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    background: var(--main);
    color: black;
    font-weight: bold;
    box-shadow: 0 0 15px var(--main);
}

button:hover {
    opacity: 0.8;
}

/* suggestions */
#suggestions {
    margin-top: 10px;
}

.suggestion-item {
    padding: 6px;
    cursor: pointer;
    border-radius: 10px;
    transition: 0.3s;
}

.suggestion-item:hover {
    background: rgba(0,240,255,0.2);
}

/* result */
#result {
    margin-top: 20px;
    font-size: 18px;
    color: var(--main);
}

/* footer */
.footer {
    position: absolute;
    bottom: 10px;
    width: 100%;
    font-size: 14px;
}

.footer a {
    color: var(--main);
    margin: 0 10px;
    text-decoration: none;
}
</style>

/* suggestions */
function showSuggestions() {
    let input = document.getElementById("username").value.toLowerCase();

    suggestionsDiv.innerHTML = "";

    if (input === "") return;

    for (let user in users) {
        if (user.includes(input)) {
            let div = document.createElement("div");

            div.classList.add("suggestion-item");

                document.getElementById("username").value = user;
                suggestionsDiv.innerHTML = "";
            };

}

/* search */

    let user = document.getElementById("username").value.trim();
